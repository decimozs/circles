# Apps (apps/*) and the packages they share (packages/*).
packages:
  - "apps/*"
  - "packages/*"

# Versions that must be the same in every app and package.
# Dependencies whose install scripts may run. esbuild (pulled in by the docs site) does not need one:
# it runs from its platform package.
allowBuilds:
  esbuild: false

catalog:
  "@biomejs/biome": "^2.5.15"
  "@types/react": "^19.1.8"
  "@types/react-dom": "^19.1.6"
  "lucide-react": "^1.52.0"
  "react": "^19.1.0"
  "react-dom": "^19.1.0"
  "tailwindcss": "^4.3.3"
  "typescript": "~6.0.3"
  "vite": "^8.0.16"
  "vitest": "^5.0.3"
