# The Rust workspace. Each member is a crate; the build output and Cargo.lock live here.
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

# Build settings belong to the workspace root, not to a member.
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
